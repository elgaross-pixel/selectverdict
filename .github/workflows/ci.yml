name: Editorial QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:scheduler
      - name: Run editorial acceptance QA
        shell: bash
        run: |
          set -o pipefail
          npm run qa 2>&1 | tee qa.log
      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-qa-${{ github.sha }}
          path: qa.log
      - name: Ensure generated registry is committed/current
        run: git diff --exit-code -- src/data/editorial-library.json
